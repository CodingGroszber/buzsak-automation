; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:14iosplc_ma]
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git
board = 14iosplc_ma
framework = arduino
platform_packages = framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.3.1-hf.tar.bz2
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
lib_deps = 
	ayushsharma82/ElegantOTA@^3.0.0
	me-no-dev/ESPAsyncWebServer
	me-no-dev/AsyncTCP
