; PlatformIO Project Configuration File
;
; ── Upload target — change default_envs to switch between OTA and USB ──
;   ota : wireless, requires device on WiFi at 192.168.1.94
;   usb : wired, requires USB cable on COM3
;
[platformio]
default_envs = ota

; ── Shared settings (applied to both envs) ───────────────────
[env]
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git
board = 14iosplc_v
framework = arduino
platform_packages = framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.3.1-hf.tar.bz2
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:scripts/embed_assets.py
; Analog probe diagnostic (1 = enable /diag + CSV logging, 0 = hidden/no-op)
; DIAG_SHUNT_OHMS = external 470 Ω resistor, DIAG_V_DIVIDER = board divider (calibrated)
build_flags = -DDIAG_ENABLED=1 -DDIAG_SHUNT_OHMS=470.0f -DDIAG_V_DIVIDER=3.82f
lib_deps =
	ayushsharma82/ElegantOTA@^3.0.0
	me-no-dev/ESPAsyncWebServer
	me-no-dev/AsyncTCP

; ── OTA env — wireless upload via ElegantOTA HTTP (no firewall config needed) ─
[env:ota]
upload_port = 192.168.1.94
upload_protocol = custom
upload_command = python $PROJECT_DIR/scripts/http_ota.py $UPLOAD_PORT $SOURCE

; ── USB env — wired upload via esptool ───────────────────────
[env:usb]
upload_port = COM3
upload_protocol = esptool
